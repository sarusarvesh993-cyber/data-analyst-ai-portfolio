name: portfolio-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run original analytical tests
        run: pytest -q
      - name: Compile application code
        run: python -m compileall -q portfolio_app pages streamlit_app.py scripts/export_web_data.py
      - name: Check project data generators
        run: |
          python 01-customer-churn/generate_data.py
          python 03-ab-test/generate_data.py

  vercel-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate and build static app
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm test
